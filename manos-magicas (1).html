<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Manos mágicas</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:system-ui,sans-serif;color:#e8e6ff}
video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1);opacity:1;transition:opacity .3s}
#cambtn{position:absolute;right:16px;top:60px;font:inherit;font-size:13px;padding:8px 12px;border-radius:6px;border:1px solid #7F77DD;background:rgba(0,0,0,.6);color:#e8e6ff;cursor:pointer}
canvas{position:absolute;inset:0;width:100%;height:100%}
#msg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;background:rgba(0,0,0,.7);border:1px solid #7F77DD;padding:20px 28px;border-radius:10px;max-width:90%}
#msg button{margin-top:14px;font:inherit;font-size:16px;padding:10px 18px;border-radius:8px;border:1px solid #AFA9EC;background:#26215C;color:#fff;cursor:pointer}
#hud{position:absolute;left:16px;bottom:16px;font-size:13px;background:rgba(0,0,0,.6);padding:8px 12px;border-radius:6px;line-height:1.6}
#fs{position:absolute;right:16px;top:16px;font:inherit;font-size:13px;padding:8px 12px;border-radius:6px;border:1px solid #7F77DD;background:rgba(0,0,0,.6);color:#e8e6ff;cursor:pointer}
</style>
</head>
<body>
<video id="cam" playsinline muted></video>
<canvas id="c"></canvas>
<button id="fs">Pantalla completa</button>
<button id="cambtn">Cámara: visible</button>
<div id="hud">Levanta las manos frente a la cámara · junta pulgar e índice para explotar</div>
<div id="msg">Las partículas seguirán tus dedos.<br>Necesito permiso para usar la cámara.<br><button id="go">Activar cámara</button></div>
<script type="module">
import {FilesetResolver,HandLandmarker} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";
const c=document.getElementById('c'),x=c.getContext('2d'),video=document.getElementById('cam'),msg=document.getElementById('msg');
let W,H;function rs(){W=c.width=innerWidth;H=c.height=innerHeight}rs();addEventListener('resize',rs);
const P=[];for(let i=0;i<1800;i++)P.push({x:Math.random()*innerWidth,y:Math.random()*innerHeight,vx:0,vy:0,h:Math.random()*360});
let targets=[],hands=[],mouse=null,detector=null,lastT=-1,hueShift=0;
const TIPS=[4,8,12,16,20];
const LINKS=[[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],[9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];
addEventListener('pointermove',e=>mouse={x:e.clientX,y:e.clientY});
function boom(px,py){for(const p of P){const dx=p.x-px,dy=p.y-py,d=Math.hypot(dx,dy)+1;if(d<350){p.vx+=dx/d*25;p.vy+=dy/d*25}}hueShift+=60}
const pinched=[false,false];
function toScreen(l){
  const vw=video.videoWidth||640,vh=video.videoHeight||480,s=Math.max(W/vw,H/vh),ox=(W-vw*s)/2,oy=(H-vh*s)/2;
  return{x:W-(l.x*vw*s+ox),y:l.y*vh*s+oy};
}
function loop(){
  requestAnimationFrame(loop);
  if(detector&&video.readyState>=2&&video.currentTime!==lastT){
    lastT=video.currentTime;
    const r=detector.detectForVideo(video,performance.now());
    hands=(r.landmarks||[]).map(h=>h.map(toScreen));
  }
  targets=[];
  hands.forEach((h,i)=>{TIPS.forEach(t=>targets.push(h[t]));
    const d=Math.hypot(h[4].x-h[8].x,h[4].y-h[8].y);
    if(d<40&&!pinched[i]){pinched[i]=true;boom((h[4].x+h[8].x)/2,(h[4].y+h[8].y)/2)}else if(d>70)pinched[i]=false});
  if(!targets.length&&mouse)targets=[mouse];
  x.globalCompositeOperation='destination-out';x.fillStyle='rgba(0,0,0,0.3)';x.fillRect(0,0,W,H);x.globalCompositeOperation='source-over';
  x.globalCompositeOperation='lighter';
  for(let k=0;k<P.length;k++){const p=P[k];
    if(targets.length){const t=targets[k%targets.length],dx=t.x-p.x,dy=t.y-p.y,d=Math.hypot(dx,dy)+20;
      p.vx+=dx/d*0.9+(-dy/d)*0.6;p.vy+=dy/d*0.9+(dx/d)*0.6}
    p.vx*=0.94;p.vy*=0.94;p.x+=p.vx;p.y+=p.vy;
    const sp=Math.min(Math.hypot(p.vx,p.vy),20);
    x.fillStyle=`hsla(${(p.h+hueShift+performance.now()*0.02)%360},90%,${45+sp*2}%,0.8)`;
    x.fillRect(p.x,p.y,1.5+sp*0.15,1.5+sp*0.15)}
  x.globalCompositeOperation='source-over';
  for(const h of hands){
    x.strokeStyle='rgba(175,169,236,0.7)';x.lineWidth=2;x.beginPath();
    for(const[a,b]of LINKS){x.moveTo(h[a].x,h[a].y);x.lineTo(h[b].x,h[b].y)}x.stroke();
    x.fillStyle='#fff';for(const t of TIPS){x.beginPath();x.arc(h[t].x,h[t].y,5,0,7);x.fill()}
  }
}
loop();
document.getElementById('go').onclick=async()=>{
  msg.innerHTML='Cargando el detector de manos...';
  try{
    const stream=await navigator.mediaDevices.getUserMedia({video:{width:1280,height:720,facingMode:'user'}});
    video.srcObject=stream;await video.play();
    const vision=await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
    detector=await HandLandmarker.createFromOptions(vision,{baseOptions:{modelAssetPath:"https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",delegate:"GPU"},runningMode:"VIDEO",numHands:2});
    msg.remove();
  }catch(e){
    msg.innerHTML='No pude usar la cámara o cargar el detector.<br>Revisa que diste permiso y que tienes internet.<br>Mientras tanto, las partículas siguen tu mouse.<br><button onclick="this.parentNode.remove()">Seguir con el mouse</button>';
  }
};
const modos=[[1,'Cámara: visible'],[0.35,'Cámara: tenue'],[0,'Cámara: oculta']];let mi=0;
document.getElementById('cambtn').onclick=e=>{mi=(mi+1)%3;video.style.opacity=modos[mi][0];e.target.textContent=modos[mi][1];document.body.style.background='#000'};
document.getElementById('fs').onclick=()=>{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>{})};
</script>
</body>
</html>
